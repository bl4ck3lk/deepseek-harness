# Keyless replay counterpart to github.cordis.yml: the gh-CLI gateway and the
# gh_pr_* tool suite stay real (the tool call re-executes against the
# deterministic fixture gh materialized by prepareWorkspace); only the model
# adapter is replaced by replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
          - id: github
            name: '@deepseek-ai/dsh-github'
            config:
              ghPath: !!js "process.env.DSH_ACP_GH_FIXTURE ?? '/tmp/dsh-acp-gh-fixture/gh'"
              favorites: ['fixture-owner/fixture-repo']
              cacheTtlMs: 0
              reportRoot: /tmp/dsh-acp-gh-fixture/reports
              allowWrites: false
          - id: tool-github
            name: '@deepseek-ai/dsh-tool-github'
